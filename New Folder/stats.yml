name: Update stats cards

on:
  schedule:
    # ogni giorno alle 04:17 UTC. Orario "sfalsato" di proposito: allo scoccare
    # dell'ora GitHub accoda milioni di job e i cron partono in ritardo.
    - cron: "17 4 * * *"
  workflow_dispatch:        # permette di lanciarlo a mano dalla tab Actions
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_cards.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write           # serve per ricommettere gli SVG aggiornati

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # GH_TOKEN è opzionale: se non c'è, si usa il token automatico del job.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/generate_cards.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente commit."
          else
            git commit -m "chore: update stats cards"
            git push
          fi
